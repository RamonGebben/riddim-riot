<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>
      Bass Weapons - a rhythm roguelite where every gun is a bass synth
    </title>
    <meta
      name="description"
      content="A free twin-stick rhythm roguelite in your browser. Every gun is a dubstep bass synth and every shot lands on the beat, so your build writes the song."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bass Weapons" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Bass Weapons" />
    <meta
      property="og:description"
      content="Every gun is a bass synth and every shot lands on the beat. Your build is the song. Free in your browser, desktop or phone."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Bass Weapons title glowing beside a dark arena, the player firing at enemies around the circle: every gun is a bass synth and every shot lands on the beat."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Bass Weapons",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og.png",
        "description": "A twin-stick rhythm roguelite where every gun is a dubstep bass synth and every shot is quantized to the beat, so your fighting writes the track.",
        "genre": ["Rhythm", "Roguelite", "Twin-stick shooter"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "playMode": "SinglePlayer",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
